<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#ff6b35" stroke-width="1" opacity="0.15">
    <line x1="0" y1="630" x2="400" y2="0"/>
    <line x1="200" y1="630" x2="600" y2="0"/>
    <line x1="400" y1="630" x2="800" y2="0"/>
    <line x1="600" y1="630" x2="1000" y2="0"/>
    <line x1="800" y1="630" x2="1200" y2="0"/>
    <line x1="1000" y1="630" x2="1200" y2="230"/>
  </g>
  
  <!-- Circuit board patterns -->
  <g stroke="#00b4d8" stroke-width="1.5" opacity="0.2" fill="none">
    <rect x="80" y="100" width="60" height="40" rx="4"/>
    <line x1="140" y1="120" x2="200" y2="120"/>
    <rect x="200" y="100" width="30" height="40" rx="2"/>
    <rect x="960" y="450" width="50" height="35" rx="4"/>
    <line x1="1010" y1="467" x2="1060" y2="467"/>
    <rect x="1060" y="450" width="40" height="35" rx="2"/>
  </g>
  
  <!-- Hexagon decorations -->
  <g stroke="#ff6b35" stroke-width="1.5" opacity="0.25" fill="none">
    <polygon points="100,530 120,518 140,530 140,554 120,566 100,554"/>
    <polygon points="1050,90 1070,78 1090,90 1090,114 1070,126 1050,114"/>
    <polygon points="1100,400 1120,388 1140,400 1140,424 1120,436 1100,424"/>
  </g>
  
  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  
  <!-- Accent bar bottom -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Corner accents -->
  <path d="M0,0 L60,0 L0,60 Z" fill="#ff6b35" opacity="0.15"/>
  <path d="M1200,630 L1140,630 L1200,570 Z" fill="#ff6b35" opacity="0.15"/>
  
  <!-- Title text with shadow -->
  <text x="600" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="38" fill="#000" opacity="0.3" text-anchor="middle">DNSSEC Key Rotation</text>
  <text x="600" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="38" fill="white" text-anchor="middle" filter="url(#glow)">DNSSEC Key Rotation</text>
  
  <text x="600" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="32" fill="#000" opacity="0.3" text-anchor="middle">Domain Security Assessment</text>
  <text x="600" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="32" fill="white" text-anchor="middle" filter="url(#glow)">Domain Security Assessment</text>
  
  <!-- Site branding -->
  <text x="600" y="580" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#00b4d8" opacity="0.7" text-anchor="middle">miamioh.edu.pl · Web3 Domain Institute</text>
</svg>