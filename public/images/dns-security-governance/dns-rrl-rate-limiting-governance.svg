<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="url(#accent)" stroke-width="1" opacity="0.15">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="210" x2="1200" y2="630"/>
    <line x1="0" y1="420" x2="1200" y2="630"/>
    <line x1="400" y1="0" x2="1200" y2="630"/>
    <line x1="800" y1="0" x2="1200" y2="420"/>
  </g>
  
  <!-- Hexagon decorations -->
  <g fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2">
    <polygon points="100,80 130,63 160,80 160,113 130,130 100,113"/>
    <polygon points="1040,500 1070,483 1100,500 1100,533 1070,550 1040,533"/>
    <polygon points="1050,120 1072,108 1094,120 1094,144 1072,156 1050,144"/>
    <polygon points="80,450 102,438 124,450 124,474 102,486 80,474"/>
  </g>
  
  <!-- Circuit board pattern -->
  <g stroke="#7b2ff7" stroke-width="1" opacity="0.15">
    <path d="M150,315 L250,315 L250,250 L350,250" fill="none"/>
    <path d="M850,315 L950,315 L950,380 L1050,380" fill="none"/>
    <circle cx="250" cy="250" r="3" fill="#7b2ff7"/>
    <circle cx="350" cy="250" r="3" fill="#7b2ff7"/>
    <circle cx="950" cy="380" r="3" fill="#7b2ff7"/>
    <circle cx="1050" cy="380" r="3" fill="#7b2ff7"/>
  </g>
  
  <!-- Corner accents -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.5">
    <polyline points="0,30 0,0 30,0" fill="none"/>
    <polyline points="1170,0 1200,0 1200,30" fill="none"/>
    <polyline points="0,600 0,630 30,630" fill="none"/>
    <polyline points="1170,630 1200,630 1200,600" fill="none"/>
  </g>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Title text with shadow -->
  <text x="600" y="280" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" filter="url(#glow)">DNS RRL</text>
  <text x="600" y="340" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif" filter="url(#glow)">Configuration
and Domain Governance</text>
  
  <!-- Cluster tag -->
  <rect x="480" y="440" width="240" height="36" rx="18" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <text x="600" y="464" text-anchor="middle" fill="#00d4ff" font-size="16" font-family="DejaVu Sans, Arial, sans-serif">DNS SECURITY GOVERNANCE</text>
  
  <!-- Domain label -->
  <text x="1140" y="610" text-anchor="end" fill="#4a5568" font-size="14" font-family="DejaVu Sans, Arial, sans-serif">miamioh.edu.pl</text>
  
  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)" opacity="0.4"/>
</svg>