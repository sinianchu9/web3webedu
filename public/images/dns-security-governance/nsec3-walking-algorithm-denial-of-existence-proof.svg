<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#2a2a5e" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#3a3a7e" stroke-width="0.3">
    <line x1="0" y1="630" x2="1200" y2="0"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  
  <!-- Hexagons -->
  <g fill="none" stroke="#4a4a9e" stroke-width="1">
    <polygon points="150,315 180,285 240,285 270,315 240,345 180,345"/>
    <polygon points="950,200 980,170 1040,170 1070,200 1040,230 980,230"/>
    <polygon points="1000,450 1030,420 1090,420 1120,450 1090,480 1030,480"/>
  </g>
  
  <!-- Circuit pattern -->
  <g stroke="#5a5aae" stroke-width="1.5" fill="none">
    <polyline points="100,100 100,200 150,200 150,250"/>
    <polyline points="1100,500 1100,400 1050,400 1050,350"/>
    <circle cx="150" cy="250" r="5" fill="#5a5aae"/>
    <circle cx="1050" cy="350" r="5" fill="#5a5aae"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" filter="url(#glow)">
    NSEC3 Walking Algorithm
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0a0c0">
    Denial of Existence Proof in DNSSEC
  </text>
  
  <!-- Keywords box -->
  <rect x="400" y="380" width="400" height="50" rx="10" fill="#2a2a5e" stroke="#5a5aae"/>
  <text x="600" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#80c0ff">
    NSEC3 | DNSSEC | Hash Chain
  </text>
  
  <!-- Site domain -->
  <text x="1150" y="600" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6060a0">
    miamioh.edu.pl
  </text>
  
  <!-- Corner decorations -->
  <rect x="20" y="20" width="40" height="4" fill="#5a5aae"/>
  <rect x="20" y="20" width="4" height="40" fill="#5a5aae"/>
  <rect x="1140" y="20" width="40" height="4" fill="#5a5aae"/>
  <rect x="1176" y="20" width="4" height="40" fill="#5a5aae"/>
  <rect x="20" y="606" width="40" height="4" fill="#5a5aae"/>
  <rect x="20" y="570" width="4" height="40" fill="#5a5aae"/>
</svg>