<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#00d4ff" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="630" x2="600" y2="0"/>
    <line x1="200" y1="630" x2="800" y2="0"/>
    <line x1="400" y1="630" x2="1000" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="0"/>
  </g>
  <g stroke="#7b2ff7" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="630"/>
    <line x1="200" y1="0" x2="800" y2="630"/>
    <line x1="400" y1="0" x2="1000" y2="630"/>
    <line x1="600" y1="0" x2="1200" y2="630"/>
  </g>
  
  <!-- Hexagons -->
  <g fill="none" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="1.5">
    <polygon points="150,280 180,263 210,280 210,314 180,331 150,314"/>
    <polygon points="990,180 1020,163 1050,180 1050,214 1020,231 990,214"/>
    <polygon points="850,420 880,403 910,420 910,454 880,471 850,454"/>
  </g>
  
  <!-- Circuit board patterns -->
  <g stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1" fill="none">
    <path d="M 50,500 L 100,500 L 100,450 L 150,450"/>
    <path d="M 1050,100 L 1100,100 L 1100,150 L 1150,150"/>
    <circle cx="150" cy="450" r="3" fill="#00d4ff" fill-opacity="0.3"/>
    <circle cx="1150" cy="150" r="3" fill="#00d4ff" fill-opacity="0.3"/>
  </g>
  
  <!-- Corner decorations -->
  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <path d="M 0,60 L 0,0 L 60,0"/>
    <path d="M 1140,630 L 1200,630 L 1200,570"/>
  </g>
  
  <!-- Accent bar -->
  <rect x="80" y="260" width="8" height="110" rx="4" fill="url(#accent)" filter="url(#glow)"/>
  
  <!-- Title text with shadow -->
  <text x="110" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="36" fill="#000000" fill-opacity="0.4" letter-spacing="1">DNS RRL Resolution Stability</text>
  <text x="108" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="36" fill="#ffffff" letter-spacing="1">DNS RRL Resolution Stability</text>
  
  <!-- Subtitle -->
  <text x="110" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#8899bb" letter-spacing="0.5">Assessing rate limiting impact on DNS resolution availability</text>
  
  <!-- Keywords tag -->
  <rect x="110" y="400" rx="14" ry="14" width="124" height="32" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="130" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#00d4ff" font-weight="bold">DNS RRL</text>
  
  <!-- Site domain -->
  <text x="980" y="590" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#445577" letter-spacing="1">miamioh.edu.pl</text>
  
  <!-- Cluster label -->
  <rect x="110" y="460" rx="8" ry="8" width="120" height="24" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="120" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#9977ff">RESEARCH</text>
</svg>