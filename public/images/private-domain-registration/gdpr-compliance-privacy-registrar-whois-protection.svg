<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GDPR Compliance for Domain Privacy Registrars">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#2a3a5e" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <!-- Vertical grid lines -->
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
  </g>
  
  <!-- Decorative shapes -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#4a6fa5" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="530" r="80" fill="none" stroke="#4a6fa5" stroke-width="1" opacity="0.3"/>
  <rect x="50" y="450" width="100" height="100" fill="none" stroke="#4a6fa5" stroke-width="1" opacity="0.2" transform="rotate(15 100 500)"/>
  <rect x="1050" y="80" width="80" height="80" fill="none" stroke="#4a6fa5" stroke-width="1" opacity="0.2" transform="rotate(-10 1090 120)"/>
  
  <!-- Hexagons (crypto symbols) -->
  <g opacity="0.4">
    <polygon points="150,400 180,420 180,460 150,480 120,460 120,420" fill="none" stroke="#4a6fa5" stroke-width="1"/>
    <polygon points="1050,150 1080,170 1080,210 1050,230 1020,210 1020,170" fill="none" stroke="#4a6fa5" stroke-width="1"/>
  </g>
  
  <!-- Corner decorations -->
  <path d="M0,0 L80,0 L0,80 Z" fill="#4a6fa5" opacity="0.2"/>
  <path d="M1200,0 L1120,0 L1200,80 Z" fill="#4a6fa5" opacity="0.2"/>
  <path d="M0,630 L80,630 L0,550 Z" fill="#4a6fa5" opacity="0.2"/>
  <path d="M1200,630 L1120,630 L1200,550 Z" fill="#4a6fa5" opacity="0.2"/>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" filter="url(#glow)">
    GDPR Compliance for Domain Privacy Registrars
  </text>
  
  <!-- Keywords -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#8a9cc5">
    GDPR | WHOIS | Privacy Protection
  </text>
  
  <!-- Bottom bar with site name -->
  <rect x="0" y="570" width="1200" height="60" fill="#0f1525" opacity="0.8"/>
  <text x="600" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6a7a9a">
    miamioh.edu.pl | Web3 Domain Institute
  </text>
  
  <!-- Subtle circuit lines -->
  <g stroke="#3a5a8a" stroke-width="1" opacity="0.3">
    <path d="M0,300 L100,300 L120,280 L200,280" fill="none"/>
    <path d="M1200,300 L1100,300 L1080,320 L1000,320" fill="none"/>
    <path d="M0,330 L80,330 L100,350 L180,350" fill="none"/>
    <path d="M1200,330 L1120,330 L1100,350 L1020,350" fill="none"/>
  </g>
</svg>