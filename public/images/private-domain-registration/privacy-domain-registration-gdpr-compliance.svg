    <polygon points="1050,500 1080,485 1080,455 1050,440 1020,455 1020,485"/>
    <polygon points="950,150 980,135 980,105 950,90 920,105 920,135"/>
  </g>

  <!-- Circuit patterns -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.15">
    <path d="M50,300 L150,300 L150,250 L250,250"/>
    <path d="M1150,350 L1050,350 L1050,400 L950,400"/>
    <circle cx="150" cy="250" r="3" fill="#00d9ff"/>
    <circle cx="1050" cy="400" r="3" fill="#00d9ff"/>
