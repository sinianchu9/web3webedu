  </text>

  <!-- Subtitle -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="20" fill="#a0c4e8" text-anchor="middle" dominant-baseline="middle">
    WHOIS, RDAP and Data Protection Protocols
  </text>

  <!-- Keyword tags -->
  <g>
    <rect x="350" y="400" width="200" height="40" rx="20" fill="#00d9ff" opacity="0.9"/>
    <text x="450" y="427" font-family="Arial, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="middle" font-weight="bold">USDT 购买域名</text>

    <rect x="650" y="400" width="200" height="40" rx="20" fill="#00d9ff" opacity="0.9"/>
    <text x="750" y="427" font-family="Arial, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="middle" font-weight="bold">Web3 域名</text>
  </g>

