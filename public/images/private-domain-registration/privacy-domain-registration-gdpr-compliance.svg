  <!-- BTC symbol -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="48" fill="#f7931a" opacity="0.15">₿</text>

  <!-- ETH symbol -->
  <text x="1050" y="250" font-family="Arial, sans-serif" font-size="40" fill="#627eea" opacity="0.15">◆</text>

  <!-- Main title -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
