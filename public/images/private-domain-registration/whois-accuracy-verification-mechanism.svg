<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3a"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g stroke="#2a4a7a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Diagonal accent lines -->
  <g stroke="#4a9eff" stroke-width="1" opacity="0.15">
    <line x1="0" y1="630" x2="400" y2="0"/>
    <line x1="200" y1="630" x2="600" y2="0"/>
    <line x1="600" y1="630" x2="1000" y2="0"/>
    <line x1="800" y1="630" x2="1200" y2="0"/>
    <line x1="1200" y1="630" x2="1200" y2="230"/>
  </g>

  <!-- Hexagon decorations -->
  <g fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.2">
    <polygon points="100,80 115,65 130,80 130,100 115,115 100,100"/>
    <polygon points="1070,500 1085,485 1100,500 1100,520 1085,535 1070,520"/>
    <polygon points="150,450 165,435 180,450 180,470 165,485 150,470"/>
  </g>

  <!-- Corner dots -->
  <g fill="#4a9eff" opacity="0.3">
    <circle cx="30" cy="30" r="3"/>
    <circle cx="1170" cy="30" r="3"/>
    <circle cx="30" cy="600" r="3"/>
    <circle cx="1170" cy="600" r="3"/>
  </g>

  <!-- Glow bar -->
  <rect x="0" y="200" width="1200" height="230" fill="url(#glow)" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">WHOIS信息准确性验证机制</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#8899bb">WHOIS Accuracy Verification Mechanism</text>

  <!-- Divider line -->
  <line x1="400" y1="345" x2="800" y2="345" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>

  <!-- Keywords -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#6699cc">
    <rect x="320" y="365" width="120" height="30" rx="15" fill="#1a3a6a" opacity="0.8"/>
    <text x="380" y="385" text-anchor="middle">WHOIS</text>
    <rect x="460" y="365" width="120" height="30" rx="15" fill="#1a3a6a" opacity="0.8"/>
    <text x="520" y="385" text-anchor="middle">隐私注册</text>
    <rect x="600" y="365" width="120" height="30" rx="15" fill="#1a3a6a" opacity="0.8"/>
    <text x="660" y="385" text-anchor="middle">准确性</text>
  </g>

  <!-- Circuit-like decoration at bottom -->
  <g stroke="#4a9eff" stroke-width="1" opacity="0.2" fill="none">
    <polyline points="100,560 200,560 200,520 280,520"/>
    <polyline points="900,560 1000,560 1000,520 920,520"/>
    <circle cx="200" cy="560" r="4" fill="#4a9eff"/>
    <circle cx="1000" cy="560" r="4" fill="#4a9eff"/>
  </g>

  <!-- Site domain -->
  <text x="1170" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#556688">miamioh.edu.pl</text>

  <!-- Bitcoin symbol (decorative) -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="32" fill="#f7931a" opacity="0.4">₿</text>
  <text x="1100" y="120" font-family="Arial, sans-serif" font-size="24" fill="#627eea" opacity="0.4">◇</text>
</svg>