   <stop offset="50%" style="stop-color:#a855f7"/>
   <stop offset="100%" style="stop-color:#627eea"/>
  </linearGradient>
  <filter id="glow">
   <feGaussianBlur stdDeviation="4" result="blur"/>
   <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
