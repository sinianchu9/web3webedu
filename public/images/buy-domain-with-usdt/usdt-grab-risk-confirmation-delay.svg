<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0a23"/>
    <stop offset="50%" style="stop-color:#1a1a3e"/>
    <stop offset="100%" style="stop-color:#16213e"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#00d4ff"/>
    <stop offset="100%" style="stop-color:#7b2ff7"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="630" fill="url(#bg)"/>

<!-- Grid pattern -->
<g opacity="0.08" stroke="#00d4ff" stroke-width="0.5" fill="none">
  <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
  <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
  <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
  <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
  <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
  <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
  <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
  <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
  <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
  <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
  <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
  <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
  <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
  <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
  <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
  <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
  <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
  <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
  <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
  <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
  <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
  <line x1="0" y1="600" x2="1200" y2="600"/>
</g>

<!-- Diagonal lines -->
<g opacity="0.06" stroke="#7b2ff7" stroke-width="1" fill="none">
  <line x1="0" y1="630" x2="630" y2="0"/>
  <line x1="200" y1="630" x2="830" y2="0"/>
  <line x1="400" y1="630" x2="1030" y2="0"/>
  <line x1="600" y1="630" x2="1200" y2="0"/>
</g>

<!-- Hexagons -->
<g opacity="0.1" stroke="#00d4ff" stroke-width="1" fill="none">
  <polygon points="100,280 130,263 160,280 160,314 130,331 100,314"/>
  <polygon points="1040,180 1070,163 1100,180 1100,214 1070,231 1040,214"/>
  <polygon points="900,420 930,403 960,420 960,454 930,471 900,454"/>
</g>

<!-- Circuit board pattern -->
<g opacity="0.08" stroke="#00d4ff" stroke-width="0.8" fill="none">
  <path d="M 150,500 L 150,450 L 250,450 L 250,400"/>
  <path d="M 950,150 L 950,200 L 850,200 L 850,250"/>
  <circle cx="150" cy="500" r="3" fill="#00d4ff"/>
  <circle cx="250" cy="400" r="3" fill="#00d4ff"/>
  <circle cx="950" cy="150" r="3" fill="#00d4ff"/>
  <circle cx="850" cy="250" r="3" fill="#00d4ff"/>
</g>

<!-- Top accent line -->
<rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.8"/>

<!-- Corner decorations -->
<g opacity="0.3">
  <rect x="30" y="30" width="8" height="8" fill="#00d4ff"/>
  <rect x="1162" y="30" width="8" height="8" fill="#7b2ff7"/>
  <rect x="30" y="592" width="8" height="8" fill="#7b2ff7"/>
  <rect x="1162" y="592" width="8" height="8" fill="#00d4ff"/>
</g>

<!-- Cluster label -->
<rect x="60" y="540" width="200" height="30" rx="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
<text x="160" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle" opacity="0.7">buy-domain-with-usdt</text>

<!-- Title -->
<g filter="url(#glow)">
  <text x="600" y="310" font-family="Noto Sans CJK SC, DejaVu Sans, Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">USDT支付确认延迟与域名抢注风险</text>
  
</g>

<!-- Subtitle -->
<text x="600" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">区块链确认时序与域名注册安全评估</text>

<!-- Site domain -->
<text x="1100" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#4a5568" text-anchor="end">miamioh.edu.pl</text>

<!-- Bottom accent line -->
<rect x="0" y="627" width="1200" height="3" fill="url(#accent)" opacity="0.5"/>
</svg>