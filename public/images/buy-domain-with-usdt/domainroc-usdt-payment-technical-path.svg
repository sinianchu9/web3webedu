<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
 <defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#0a0e27"/>
   <stop offset="50%" style="stop-color:#1a1f4e"/>
   <stop offset="100%" style="stop-color:#0d1340"/>
  </linearGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" style="stop-color:#26a17b"/>
   <stop offset="50%" style="stop-color:#627eea"/>
   <stop offset="100%" style="stop-color:#26a17b"/>
  </linearGradient>
  <filter id="glow">
   <feGaussianBlur stdDeviation="4" result="blur"/>
   <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
 <!-- Background -->
 <rect width="1200" height="630" fill="url(#bg)"/>
 <!-- Grid -->
 <g opacity="0.08" stroke="#26a17b" stroke-width="0.5">
  <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/>
  <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="630" x2="1200" y2="630"/>
 </g>
 <!-- Diagonal lines -->
 <g opacity="0.06" stroke="#26a17b" stroke-width="1">
  <line x1="0" y1="630" x2="400" y2="0"/><line x1="200" y1="630" x2="600" y2="0"/><line x1="800" y1="630" x2="1200" y2="0"/><line x1="1000" y1="630" x2="1200" y2="230"/>
 </g>
 <!-- Hexagons -->
 <g opacity="0.1" fill="none" stroke="#26a17b" stroke-width="1">
  <polygon points="150,80 185,60 220,80 220,120 185,140 150,120"/>
  <polygon points="950,450 985,430 1020,450 1020,490 985,510 950,490"/>
  <polygon points="1050,150 1085,130 1120,150 1120,190 1085,210 1050,190"/>
 </g>
 <!-- USDT icon circle -->
 <circle cx="200" cy="315" r="50" fill="none" stroke="#26a17b" stroke-width="2" opacity="0.3"/>
 <text x="200" y="335" font-family="monospace" font-size="40" fill="#26a17b" text-anchor="middle" opacity="0.5">₮</text>
 <!-- Domain icon -->
 <rect x="950" y="270" width="80" height="80" rx="8" fill="none" stroke="#627eea" stroke-width="2" opacity="0.3"/>
 <text x="990" y="325" font-family="monospace" font-size="28" fill="#627eea" text-anchor="middle" opacity="0.5">.com</text>
 <!-- Connection line between USDT and Domain -->
 <line x1="260" y1="315" x2="940" y2="315" stroke="#26a17b" stroke-width="1.5" opacity="0.2" stroke-dasharray="8,4"/>
 <!-- Arrow nodes on connection -->
 <circle cx="400" cy="315" r="4" fill="#26a17b" opacity="0.4"/>
 <circle cx="600" cy="315" r="4" fill="#627eea" opacity="0.4"/>
 <circle cx="800" cy="315" r="4" fill="#26a17b" opacity="0.4"/>
 <!-- Top accent bar -->
 <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
 <!-- Bottom accent bar -->
 <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
 <!-- Main title -->
 <text x="600" y="180" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">DomainRoc USDT</text>
 <text x="600" y="230" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">Payment Technical Path</text>
 <!-- Subtitle -->
 <text x="600" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a0aec0" text-anchor="middle">TRC-20 / ERC-20 Settlement Architecture · On-Chain Verification · ICANN Compliance</text>
 <!-- Flow diagram: simplified payment flow -->
 <g transform="translate(200, 420)" opacity="0.6">
  <rect x="0" y="0" width="120" height="40" rx="6" fill="none" stroke="#26a17b" stroke-width="1.5"/>
  <text x="60" y="25" font-family="monospace" font-size="12" fill="#26a17b" text-anchor="middle">Order</text>
  <line x1="130" y1="20" x2="170" y2="20" stroke="#26a17b" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="180" y="0" width="120" height="40" rx="6" fill="none" stroke="#627eea" stroke-width="1.5"/>
  <text x="240" y="25" font-family="monospace" font-size="12" fill="#627eea" text-anchor="middle">TXID Verify</text>
  <line x1="310" y1="20" x2="350" y2="20" stroke="#627eea" stroke-width="1"/>
  <rect x="360" y="0" width="120" height="40" rx="6" fill="none" stroke="#26a17b" stroke-width="1.5"/>
  <text x="420" y="25" font-family="monospace" font-size="12" fill="#26a17b" text-anchor="middle">API Register</text>
  <line x1="490" y1="20" x2="530" y2="20" stroke="#26a17b" stroke-width="1"/>
  <rect x="540" y="0" width="120" height="40" rx="6" fill="none" stroke="#14f195" stroke-width="1.5"/>
  <text x="600" y="25" font-family="monospace" font-size="12" fill="#14f195" text-anchor="middle">Domain Active</text>
 </g>
 <!-- Keywords bottom -->
 <text x="600" y="560" font-family="monospace" font-size="14" fill="#26a17b" text-anchor="middle" opacity="0.7">USDT · TRC-20 · ERC-20 · ICANN · Whois Privacy · Cloudflare DNS · DomainRoc</text>
 <!-- Branding -->
 <text x="600" y="600" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#4a5568" text-anchor="middle">www.domainroc.com</text>
</svg>