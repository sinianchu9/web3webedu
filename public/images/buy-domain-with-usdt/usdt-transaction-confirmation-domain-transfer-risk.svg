<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Diagonal lines -->
  <g stroke="#2a4a7f" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="630" x2="630" y2="0"/>
    <line x1="200" y1="630" x2="830" y2="0"/>
    <line x1="400" y1="630" x2="1030" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="0"/>
    <line x1="0" y1="0" x2="600" y2="630"/>
    <line x1="200" y1="0" x2="800" y2="630"/>
    <line x1="400" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Hexagons -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.15">
    <polygon points="100,280 130,260 160,280 160,320 130,340 100,320"/>
    <polygon points="1040,180 1070,160 1100,180 1100,220 1070,240 1040,220"/>
    <polygon points="900,420 930,400 960,420 960,460 930,480 900,460"/>
    <polygon points="200,450 230,430 260,450 260,490 230,510 200,490"/>
  </g>
  <!-- Corner accents -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.6">
    <polyline points="0,50 0,0 50,0" fill="none"/>
    <polyline points="1150,0 1200,0 1200,50" fill="none"/>
    <polyline points="1200,580 1200,630 1150,630" fill="none"/>
    <polyline points="50,630 0,630 0,580" fill="none"/>
  </g>
  <!-- Accent bar -->
  <rect x="100" y="260" width="1000" height="3" fill="url(#accent)" opacity="0.6" rx="1"/>
  <!-- Title text with shadow -->
  <text x="600" y="230" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="42" fill="#ffffff" filter="url(#glow)">USDT Transaction Risk</text>
  <text x="602" y="232" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="42" fill="#ffffff" opacity="0.3">USDT Transaction Risk</text>
  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#8899bb">Domain Transfer Security Assessment</text>
  <!-- Cluster tag -->
  <rect x="440" y="350" width="320" height="32" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <text x="600" y="372" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#00d4ff">buy-domain-with-usdt</text>
  <!-- Domain -->
  <text x="1180" y="615" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#4a5568">miamioh.edu.pl</text>
</svg>