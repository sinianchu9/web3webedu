<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1e3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1233;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6b35ff;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Grid lines -->
  <g stroke="#1a2a4a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#ff6b35" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="630" x2="600" y2="0"/>
    <line x1="200" y1="630" x2="800" y2="0"/>
    <line x1="400" y1="630" x2="1000" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="0"/>
    <line x1="0" y1="0" x2="600" y2="630"/>
    <line x1="200" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Circuit patterns -->
  <g stroke="#ff6b35" stroke-width="1" opacity="0.2" fill="none">
    <!-- Hexagons -->
    <polygon points="150,100 180,83 210,100 210,133 180,150 150,133"/>
    <polygon points="950,480 980,463 1010,480 1010,513 980,530 950,513"/>
    <polygon points="1050,150 1080,133 1110,150 1110,183 1080,200 1050,183"/>
    <polygon points="80,420 110,403 140,420 140,453 110,470 80,453"/>
    <!-- Connection lines -->
    <line x1="210" y1="117" x2="400" y2="117"/>
    <line x1="400" y1="117" x2="400" y2="200"/>
    <circle cx="400" cy="200" r="4" fill="#ff6b35" opacity="0.3"/>
    <line x1="950" y1="497" x2="750" y2="497"/>
    <line x1="750" y1="497" x2="750" y2="420"/>
    <circle cx="750" cy="420" r="4" fill="#ff6b35" opacity="0.3"/>
  </g>
  
  <!-- Corner accents -->
  <g stroke="#ff6b35" stroke-width="2" opacity="0.6">
    <polyline points="20,50 20,20 50,20" fill="none"/>
    <polyline points="1150,20 1180,20 1180,50" fill="none"/>
    <polyline points="20,580 20,610 50,610" fill="none"/>
    <polyline points="1150,610 1180,610 1180,580" fill="none"/>
  </g>
  
  <!-- Decorative bar -->
  <rect x="100" y="280" width="1000" height="3" fill="url(#accent-grad)" opacity="0.5" rx="1.5"/>
  <rect x="100" y="350" width="1000" height="3" fill="url(#accent-grad)" opacity="0.3" rx="1.5"/>
  
  <!-- Small dots pattern -->
  <g fill="#ff6b35" opacity="0.15">
    <circle cx="100" cy="200" r="2"/>
    <circle cx="100" cy="430" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="200" cy="430" r="2"/>
    <circle cx="300" cy="200" r="2"/>
    <circle cx="300" cy="430" r="2"/>
    <circle cx="400" cy="200" r="2"/>
    <circle cx="400" cy="430" r="2"/>
    <circle cx="500" cy="200" r="2"/>
    <circle cx="500" cy="430" r="2"/>
    <circle cx="600" cy="200" r="2"/>
    <circle cx="600" cy="430" r="2"/>
    <circle cx="700" cy="200" r="2"/>
    <circle cx="700" cy="430" r="2"/>
    <circle cx="800" cy="200" r="2"/>
    <circle cx="800" cy="430" r="2"/>
    <circle cx="900" cy="200" r="2"/>
    <circle cx="900" cy="430" r="2"/>
    <circle cx="1000" cy="200" r="2"/>
    <circle cx="1000" cy="430" r="2"/>
    <circle cx="1100" cy="200" r="2"/>
    <circle cx="1100" cy="430" r="2"/>
  </g>
  
  <!-- Title text with shadow -->
  <g filter="url(#glow)">
    <text x="600" y="305" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle" opacity="0.15">FATF Travel Rule</text>
  </g>
  <text x="600" y="305" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">FATF Travel Rule</text>
  
  <g filter="url(#glow)">
    <text x="600" y="345" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle" opacity="0.15">Cross-Border Domain</text>
  </g>
  <text x="600" y="345" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle">Cross-Border Domain</text>
  
  <g filter="url(#glow)">
    <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ff6b35" text-anchor="middle" opacity="0.15">Registration Compliance</text>
  </g>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ff6b35" text-anchor="middle">Registration Compliance</text>
  
  <!-- Bottom label -->
  <text x="600" y="570" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6a7a9a" text-anchor="middle">miamioh.edu.pl · Web3 Domain Research</text>
  
  <!-- Top category badge -->
  <rect x="50" y="555" width="130" height="28" rx="14" fill="#ff6b35" opacity="0.2"/>
  <text x="115" y="574" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ff6b35" text-anchor="middle">Cross Border Domain Compliance</text>
</svg>