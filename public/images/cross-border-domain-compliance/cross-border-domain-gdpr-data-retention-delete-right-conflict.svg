  <rect x="0" y="570" width="1200" height="2" fill="#7B68EE" opacity="0.6"/>
  
  <!-- Icon -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="72" fill="#7B68EE" text-anchor="middle" opacity="0.3" font-weight="bold">◇</text>
  
  <!-- Main title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" text-anchor="middle" font-weight="bold" letter-spacing="2">
