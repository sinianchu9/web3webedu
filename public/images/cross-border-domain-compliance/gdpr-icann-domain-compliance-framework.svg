<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <!-- Vertical grid -->
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <!-- Horizontal grid -->
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
  </g>
  
  <!-- Circuit lines -->
  <g stroke="#00d4ff" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <path d="M 50 400 L 150 400 L 150 350 L 250 350"/>
    <path d="M 1150 200 L 1050 200 L 1050 250 L 950 250"/>
    <path d="M 100 100 L 100 200 L 200 200"/>
    <path d="M 1100 500 L 1100 400 L 1000 400"/>
  </g>
  
  <!-- Hexagons -->
  <g fill="none" stroke="#00d4ff" stroke-opacity="0.12" stroke-width="1">
    <polygon points="900,80 930,95 930,125 900,140 870,125 870,95"/>
    <polygon points="200,500 230,515 230,545 200,560 170,545 170,515"/>
    <polygon points="1050,400 1080,415 1080,445 1050,460 1020,445 1020,415"/>
  </g>
  
  <!-- Bitcoin symbol -->
  <text x="80" y="180" font-family="Arial" font-size="40" fill="#f7931a" opacity="0.3">₿</text>
  
  <!-- Ethereum symbol -->
  <text x="1120" y="380" font-family="Arial" font-size="36" fill="#627eea" opacity="0.3">◆</text>
  
  <!-- Corner dots -->
  <circle cx="30" cy="30" r="4" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1170" cy="30" r="4" fill="#00d4ff" opacity="0.4"/>
  <circle cx="30" cy="600" r="4" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1170" cy="600" r="4" fill="#00d4ff" opacity="0.4"/>
  
  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" filter="url(#glow)">GDPR域名注册数据保护框架与ICANN合规要求分析</text>
  
  <!-- Subtitle/keywords -->
  <text x="600" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a0a0c0">GDPR | ICANN | 域名合规 | Data Protection</text>
  
  <!-- Divider line -->
  <line x1="350" y1="340" x2="850" y2="340" stroke="#00d4ff" stroke-opacity="0.3"/>
  
  <!-- Cluster tag -->
  <rect x="500" y="500" width="200" height="36" rx="18" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-opacity="0.4"/>
  <text x="600" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff">Web3 Domain Institute</text>
  
  <!-- Domain -->
  <text x="1170" y="610" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#606080">www.miamioh.edu.pl</text>
</svg>