<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#2a3a5e" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="1200" y2="630"/><line x1="300" y1="0" x2="1200" y2="630"/>
    <line x1="600" y1="0" x2="1200" y2="630"/><line x1="900" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="0" y1="157" x2="1200" y2="157"/><line x1="0" y1="78" x2="1200" y2="78"/>
  </g>
  <g stroke="#3a4a7e" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
  </g>
  <!-- Corner hexagons -->
  <g fill="none" stroke="#4a6a9e" stroke-width="1" opacity="0.3">
    <polygon points="60,30 75,15 90,30 90,60 75,75 60,60"/>
    <polygon points="1110,570 1125,555 1140,570 1140,600 1125,615 1110,600"/>
  </g>
  <!-- BTC symbol -->
  <g transform="translate(80,480)" opacity="0.15" fill="#f7931a">
    <text x="0" y="0" font-family="serif" font-size="120" font-weight="bold">B</text>
  </g>
  <!-- USDT symbol -->
  <g transform="translate(1000,80)" opacity="0.12" fill="#26a17b">
    <text x="0" y="0" font-family="Arial" font-size="100" font-weight="bold">$</text>
  </g>
  <!-- Title -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" filter="url(#glow)">Cross-border Domain UDRP</text>
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#8a9ac0">Arbitration & DNS Governance Impact</text>
  <!-- Keyword tag -->
  <rect x="480" y="380" width="240" height="36" rx="18" fill="none" stroke="#4a8ae8" stroke-width="1.5" opacity="0.7"/>
  <text x="600" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6aa8ff">USDT 购买域名 | 域名治理</text>
  <!-- Bottom domain -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5a6a8a">www.miamioh.edu.pl | Web3 Domain Research Institute</text>
  <!-- Decorative lines -->
  <g stroke="#4a7ab8" stroke-width="1" opacity="0.4">
    <line x1="200" y1="420" x2="200" y2="450"/>
    <line x1="1000" y1="420" x2="1000" y2="450"/>
    <circle cx="200" cy="455" r="3" fill="#4a7ab8"/>
    <circle cx="1000" cy="455" r="3" fill="#4a7ab8"/>
  </g>
</svg>