    <line x1="0" y1="0" x2="1200" y2="0"/> <line x1="0" y1="40" x2="1200" y2="40"/> <line x1="0" y1="80" x2="1200" y2="80"/> <line x1="0" y1="120" x2="1200" y2="120"/> <line x1="0" y1="160" x2="1200" y2="160"/> <line x1="0" y1="200" x2="1200" y2="200"/> <line x1="0" y1="240" x2="1200" y2="240"/> <line x1="0" y1="280" x2="1200" y2="280"/> <line x1="0" y1="320" x2="1200" y2="320"/> <line x1="0" y1="360" x2="1200" y2="360"/> <line x1="0" y1="400" x2="1200" y2="400"/> <line x1="0" y1="440" x2="1200" y2="440"/> <line x1="0" y1="480" x2="1200" y2="480"/> <line x1="0" y1="520" x2="1200" y2="520"/> <line x1="0" y1="560" x2="1200" y2="560"/> <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Diagonal lines -->
  <g stroke="#4fc3f7" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="630" x2="400" y2="0"/>
    <line x1="200" y1="630" x2="600" y2="0"/>
    <line x1="400" y1="630" x2="800" y2="0"/>
    <line x1="600" y1="630" x2="1000" y2="0"/>
    <line x1="800" y1="630" x2="1200" y2="0"/>
  </g>
  <!-- Hexagon decorations -->
  <g fill="none" stroke="#4fc3f7" stroke-opacity="0.15" stroke-width="1.5">
    <polygon points="100,80 140,57 180,80 180,126 140,149 100,126"/>
    <polygon points="1020,500 1060,477 1100,500 1100,546 1060,569 1020,546"/>
    <polygon points="950,100 990,77 1030,100 1030,146 990,169 950,146"/>
  </g>
  <!-- Corner dots -->
  <g fill="#4fc3f7" fill-opacity="0.3">
    <circle cx="30" cy="30" r="4"/>
    <circle cx="1170" cy="30" r="4"/>
    <circle cx="30" cy="600" r="4"/>
    <circle cx="1170" cy="600" r="4"/>
  </g>
  <!-- Circuit board pattern -->
  <g stroke="#7c4dff" stroke-opacity="0.1" stroke-width="1" fill="none">
    <path d="M 50 300 L 150 300 L 150 250 L 250 250"/>
    <path d="M 1150 350 L 1050 350 L 1050 400 L 950 400"/>
    <circle cx="250" cy="250" r="3" fill="#7c4dff" fill-opacity="0.2"/>
    <circle cx="950" cy="400" r="3" fill="#7c4dff" fill-opacity="0.2"/>
  </g>
  <!-- Title text with shadow -->
  <text x="600" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" filter="url(#glow)">Stablecoin Regulation</text>
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#b0bec5">Domain Payment Compliance Pathways</text>
  <!-- Cluster badge -->
  <rect x="440" y="380" width="320" height="40" rx="20" fill="#4fc3f7" fill-opacity="0.15" stroke="#4fc3f7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="406" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#4fc3f7" font-weight="bold">Web3 Domain Institute</text>
  <!-- Domain -->
  <text x="1180" y="610" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#607d8b">www.miamioh.edu.pl</text>
