<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal accent lines -->
  <g stroke="url(#accent)" stroke-width="1" opacity="0.4">
    <line x1="0" y1="630" x2="600" y2="0"/>
    <line x1="200" y1="630" x2="800" y2="0"/>
    <line x1="400" y1="630" x2="1000" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="0"/>
  </g>
  
  <!-- Hexagon decorations -->
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.2">
    <polygon points="150,80 180,60 210,80 210,110 180,130 150,110"/>
    <polygon points="950,450 980,430 1010,450 1010,480 980,500 950,480"/>
    <polygon points="1050,120 1080,100 1110,120 1110,150 1080,170 1050,150"/>
  </g>
  
  <!-- Circuit board patterns -->
  <g stroke="#7b2ff7" stroke-width="1" opacity="0.25">
    <path d="M100,200 L200,200 L200,300 L300,300" fill="none"/>
    <path d="M900,150 L1000,150 L1000,250" fill="none"/>
    <circle cx="300" cy="300" r="4" fill="#7b2ff7"/>
    <circle cx="1000" cy="250" r="4" fill="#7b2ff7"/>
  </g>
  
  <!-- Corner accent marks -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.6">
    <polyline points="30,30 30,80 80,80" fill="none"/>
    <polyline points="1170,30 1170,80 1120,80" fill="none"/>
    <polyline points="30,600 30,550 80,550" fill="none"/>
    <polyline points="1170,600 1170,550 1120,550" fill="none"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="300" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="bold" fill="white" filter="url(#glow)">算法稳定币域名抵押机制与DNS治理关联分析</text>
  
  
  <!-- Cluster label -->
  <rect x="420" y="360" width="360" height="36" rx="18" fill="#0d1b2a" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
  <text x="600" y="383" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#00d4ff">稳定币经济影响</text>
  
  <!-- Keyword tags -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#8ec8f0">
    <text x="200" y="480">Web3 Domain Research</text>
    <text x="200" y="505">miamioh.edu.pl</text>
  </g>
  
  <!-- Site domain -->
  <text x="1080" y="590" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#4a6fa5" opacity="0.7">miamioh.edu.pl</text>
</svg>