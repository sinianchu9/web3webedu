<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3a"/>
      <stop offset="100%" style="stop-color:#0f1f3d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#2a4a6a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="1200" y2="630"/><line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="0" x2="0" y2="630"/>
<line x1="80" y1="0" x2="80" y2="630"/>
<line x1="160" y1="0" x2="160" y2="630"/>
<line x1="240" y1="0" x2="240" y2="630"/>
<line x1="320" y1="0" x2="320" y2="630"/>
<line x1="400" y1="0" x2="400" y2="630"/>
<line x1="480" y1="0" x2="480" y2="630"/>
<line x1="560" y1="0" x2="560" y2="630"/>
<line x1="640" y1="0" x2="640" y2="630"/>
<line x1="720" y1="0" x2="720" y2="630"/>
<line x1="800" y1="0" x2="800" y2="630"/>
<line x1="880" y1="0" x2="880" y2="630"/>
<line x1="960" y1="0" x2="960" y2="630"/>
<line x1="1040" y1="0" x2="1040" y2="630"/>
<line x1="1120" y1="0" x2="1120" y2="630"/>
<line x1="1200" y1="0" x2="1200" y2="630"/>
<line x1="0" y1="0" x2="1200" y2="0"/>
<line x1="0" y1="80" x2="1200" y2="80"/>
<line x1="0" y1="160" x2="1200" y2="160"/>
<line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="320" x2="1200" y2="320"/>
<line x1="0" y1="400" x2="1200" y2="400"/>
<line x1="0" y1="480" x2="1200" y2="480"/>
<line x1="0" y1="560" x2="1200" y2="560"/>

  </g>
  
  <!-- Corner decoration -->
  <g opacity="0.6">
    <polygon points="0,0 80,0 0,80" fill="#3a5a8a"/>
    <polygon points="1200,0 1120,0 1200,80" fill="#3a5a8a"/>
    <polygon points="0,630 80,630 0,550" fill="#3a5a8a"/>
    <polygon points="1200,630 1120,630 1200,550" fill="#3a5a8a"/>
  </g>
  
  <!-- Hexagon pattern -->
  <g opacity="0.15">
    <polygon points="100,100 130,85 160,100 160,130 130,145 100,130" fill="none" stroke="#6a9fd4" stroke-width="1"/>
    <polygon points="1040,480 1070,465 1100,480 1100,510 1070,525 1040,510" fill="none" stroke="#6a9fd4" stroke-width="1"/>
    <polygon points="200,500 230,485 260,500 260,530 230,545 200,530" fill="none" stroke="#6a9fd4" stroke-width="1"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" filter="url(#glow)">Stablecoin Regulation</text>
  
  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#8ab4e8">DNS Compliance Analysis</text>
  
  <!-- Keywords -->
  <g>
    <rect x="220" y="400" width="120" height="36" rx="18" fill="#2a4a6a" opacity="0.8"/>
        <text x="280" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8ab4e8">Stablecoin</text><rect x="400" y="400" width="120" height="36" rx="18" fill="#2a4a6a" opacity="0.8"/>
        <text x="460" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8ab4e8">FATF</text><rect x="580" y="400" width="120" height="36" rx="18" fill="#2a4a6a" opacity="0.8"/>
        <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8ab4e8">DNS</text><rect x="760" y="400" width="120" height="36" rx="18" fill="#2a4a6a" opacity="0.8"/>
        <text x="820" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8ab4e8">Compliance</text>
  </g>
  
  <!-- Bottom info -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6a9fd4">Web3 Domain Institute | Domain Infrastructure Research</text>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4a7ab4">www.miamioh.edu.pl</text>
</svg>