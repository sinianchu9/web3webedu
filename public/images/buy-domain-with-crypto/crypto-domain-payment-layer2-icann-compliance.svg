<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- Diagonal lines -->
  <g stroke="#2a4a6f" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="630" x2="400" y2="0"/>
    <line x1="200" y1="630" x2="600" y2="0"/>
    <line x1="600" y1="630" x2="1000" y2="0"/>
    <line x1="800" y1="630" x2="1200" y2="0"/>
    <line x1="0" y1="400" x2="1200" y2="100"/>
  </g>
  <!-- Hexagons -->
  <g fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15">
    <polygon points="150,280 180,260 210,280 210,310 180,330 150,310"/>
    <polygon points="950,150 980,130 1010,150 1010,180 980,200 950,180"/>
    <polygon points="100,450 130,430 160,450 160,480 130,500 100,480"/>
    <polygon points="1020,400 1050,380 1080,400 1080,430 1050,450 1020,430"/>
  </g>
  <!-- Circuit board pattern -->
  <g stroke="#7b2ff7" stroke-width="1" opacity="0.2">
    <polyline points="50,500 100,500 100,470 150,470" fill="none"/>
    <polyline points="1100,200 1050,200 1050,170 1000,170" fill="none"/>
    <circle cx="150" cy="470" r="3" fill="#7b2ff7"/>
    <circle cx="1000" cy="170" r="3" fill="#7b2ff7"/>
  </g>
  <!-- Corner accents -->
  <rect x="20" y="20" width="60" height="2" fill="url(#accent)" rx="1"/>
  <rect x="20" y="20" width="2" height="60" fill="url(#accent)" rx="1"/>
  <rect x="1120" y="20" width="60" height="2" fill="url(#accent)" rx="1"/>
  <rect x="1178" y="20" width="2" height="60" fill="url(#accent)" rx="1"/>
  <rect x="20" y="608" width="60" height="2" fill="url(#accent)" rx="1"/>
  <rect x="20" y="550" width="2" height="60" fill="url(#accent)" rx="1"/>
  <rect x="1120" y="608" width="60" height="2" fill="url(#accent)" rx="1"/>
  <rect x="1178" y="550" width="2" height="60" fill="url(#accent)" rx="1"/>
  <!-- Title text with shadow -->
  <text x="600" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="42" fill="#000" opacity="0.3">Layer2 Domain Payment</text>
  <text x="600" y="288" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="42" fill="#ffffff" filter="url(#glow)">Layer2 Domain Payment</text>
  <!-- Cluster tag -->
  <rect x="440" y="340" width="320" height="36" rx="18" fill="#00d4ff" opacity="0.15"/>
  <text x="600" y="366" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#00d4ff">ICANN Compliance Assessment</text>
  <!-- Domain watermark -->
  <text x="1100" y="600" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#3a5a7f" opacity="0.6">miamioh.edu.pl</text>
  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>