  <path d="M0,50 L0,0 L50,0" fill="none" stroke="#f7931a" stroke-width="2" opacity="0.3"/>
  <path d="M1200,50 L1200,0 L1150,0" fill="none" stroke="#14f195" stroke-width="2" opacity="0.3"/>
  <path d="M0,580 L0,630 L50,630" fill="none" stroke="#627eea" stroke-width="2" opacity="0.3"/>
  <path d="M1200,580 L1200,630 L1150,630" fill="none" stroke="#f7931a" stroke-width="2" opacity="0.3"/>
