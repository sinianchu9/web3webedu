    <polygon points="950,450 985,430 1020,450 1020,490 985,510 950,490"/>
    <polygon points="1050,150 1085,130 1120,150 1120,190 1085,210 1050,190"/>
  </g>
  <!-- BTC icon circle -->
  <circle cx="200" cy="315" r="50" fill="none" stroke="#f7931a" stroke-width="2" opacity="0.3"/>
  <text x="200" y="330" font-family="monospace" font-size="36" fill="#f7931a" text-anchor="middle" opacity="0.5">₿</text>
  <!-- ETH icon diamond -->
