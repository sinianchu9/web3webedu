  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>
  <!-- Main title -->
  <text x="600" y="280" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">Cryptocurrency Domain</text>
  <text x="600" y="335" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">Payment Systems</text>
  <!-- Subtitle -->
  <text x="600" y="390" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#a0aec0" text-anchor="middle">On-Chain Settlement · Network Selection · Registrar Evaluation</text>
