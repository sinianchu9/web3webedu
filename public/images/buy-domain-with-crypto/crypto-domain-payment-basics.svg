  <text x="1000" y="325" font-family="monospace" font-size="24" fill="#627eea" text-anchor="middle" opacity="0.5">Ξ</text>
  <!-- SOL icon -->
  <rect x="930" y="140" width="40" height="4" rx="2" fill="#14f195" opacity="0.3"/>
  <rect x="935" y="152" width="35" height="4" rx="2" fill="#14f195" opacity="0.3"/>
  <rect x="940" y="164" width="30" height="4" rx="2" fill="#14f195" opacity="0.3"/>
