  <text x="600" y="460" font-family="monospace" font-size="14" fill="#627eea" text-anchor="middle" opacity="0.7">BTC · ETH · SOL · TRON · ICANN RAA · FATF Travel Rule</text>
  <!-- Course badge -->
  <rect x="500" y="500" width="200" height="36" rx="18" fill="none" stroke="#627eea" stroke-width="1.5" opacity="0.5"/>
  <text x="600" y="524" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#627eea" text-anchor="middle">COURSE</text>
