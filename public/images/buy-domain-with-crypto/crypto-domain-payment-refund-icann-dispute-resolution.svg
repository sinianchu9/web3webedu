<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1b2838"/>
      <stop offset="100%" style="stop-color:#2a1a3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4a90d9;stop-opacity:0"/>
    </linearGradient>
    <filter id="textShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  <rect width="1200" height="315" fill="url(#glow)"/>
  
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
  </g>
  
  <!-- Hexagon decorations -->
  <g fill="none" stroke="#4a90d9" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="163.3" y1="515.0" x2="163.3" y2="565.0"/>
    <line x1="163.3" y1="565.0" x2="120.0" y2="590.0"/>
    <line x1="120.0" y1="590.0" x2="76.7" y2="565.0"/>
    <line x1="76.7" y1="565.0" x2="76.7" y2="515.0"/>
    <line x1="76.7" y1="515.0" x2="120.0" y2="490.0"/>
    <line x1="120.0" y1="490.0" x2="163.3" y2="515.0"/>
    <line x1="1114.6" y1="70.0" x2="1114.6" y2="110.0"/>
    <line x1="1114.6" y1="110.0" x2="1080.0" y2="130.0"/>
    <line x1="1080.0" y1="130.0" x2="1045.4" y2="110.0"/>
    <line x1="1045.4" y1="110.0" x2="1045.4" y2="70.0"/>
    <line x1="1045.4" y1="70.0" x2="1080.0" y2="50.0"/>
    <line x1="1080.0" y1="50.0" x2="1114.6" y2="70.0"/>
  </g>
  
  <!-- Corner accents -->
  <g stroke="#4a90d9" stroke-width="2" fill="none">
    <path d="M 20 20 L 60 20 L 60 40"/>
    <path d="M 1180 610 L 1140 610 L 1140 590"/>
  </g>
  
  <!-- Circuit board pattern -->
  <g stroke="#4a90d9" stroke-opacity="0.15" stroke-width="1" fill="none">
    <path d="M 100 200 L 200 200 L 200 300 L 300 300"/>
    <circle cx="200" cy="200" r="3" fill="#4a90d9" fill-opacity="0.3"/>
    <circle cx="300" cy="300" r="3" fill="#4a90d9" fill-opacity="0.3"/>
    <path d="M 1000 400 L 900 400 L 900 350 L 850 350"/>
    <circle cx="900" cy="400" r="3" fill="#4a90d9" fill-opacity="0.3"/>
    <circle cx="850" cy="350" r="3" fill="#4a90d9" fill-opacity="0.3"/>
  </g>
  
  <!-- Title (bilingual) -->
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="32" font-weight="bold" filter="url(#textShadow)">' + title_cn + '</text>
  <text x="600" y="310" text-anchor="middle" fill="#a0b4d0" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="22" font-style="italic">' + title_en + '</text>
  
  <!-- Keywords -->
  <rect x="99.0" y="370" width="102" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="150.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">加密货币退款</text>
  <rect x="255.0" y="370" width="150" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="330.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">ICANN UDRP</text>
  <rect x="471.0" y="370" width="78" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="510.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">争议解决</text>
  <rect x="567.0" y="370" width="246" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="690.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">Blockchain Payment</text>
  <rect x="837.0" y="370" width="66" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="870.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">RAA</text>
  <rect x="1011.0" y="370" width="78" height="36" rx="18" fill="#4a90d9" fill-opacity="0.2" stroke="#4a90d9" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1050.0" y="393" text-anchor="middle" fill="#7ec8e3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="600">FATF</text>

  <!-- Domain label -->
  <text x="1180" y="620" text-anchor="end" fill="#ffffff" fill-opacity="0.4" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">miamioh.edu.pl</text>
  <text x="20" y="620" fill="#ffffff" fill-opacity="0.4" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="13">Web3 Domain Institute</text>
</svg>