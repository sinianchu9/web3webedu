    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="rgba(0,212,255,0.15)" stroke-width="1">
    <line x1="0" y1="630" x2="400" y2="0"/>
    <line x1="400" y1="630" x2="800" y2="0"/>
    <line x1="800" y1="630" x2="1200" y2="0"/>
  </g>
  
  <!-- Circuit patterns -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.2">
    <path d="M100,100 L140,100 L140,140 L180,140" fill="none"/>
    <path d="M950,80 L990,80 L990,120 L1030,120" fill="none"/>
    <path d="M200,480 L240,480 L240,520 L280,520" fill="none"/>
    <path d="M900,450 L940,450 L940,490 L980,490" fill="none"/>
  </g>
  
  <!-- Hexagons -->
  <g stroke="#7b2ff7" stroke-width="1" fill="none" opacity="0.15">
    <polygon points="80,300 110,280 140,300 140,330 110,350 80,330"/>
    <polygon points="1060,180 1090,160 1120,180 1120,210 1090,230 1060,210"/>
    <polygon points="1050,420 1080,400 1110,420 1110,450 1080,470 1050,450"/>
  </g>
  
  <!-- Corner brackets -->
  <g stroke="url(#accent-grad)" stroke-width="2" fill="none">
    <path d="M20,20 L20,60 M20,20 L60,20"/>
    <path d="M1180,20 L1180,60 M1180,20 L1140,20"/>
    <path d="M20,610 L20,570 M20,610 L60,610"/>
    <path d="M1180,610 L1180,570 M1180,610 L1140,610"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="200" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="bold" filter="url(#glow)">ENS Domain Resolution</text>
  <text x="600" y="260" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="bold" filter="url(#glow)">& ICANN DNS Root</text>
  <text x="600" y="320" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="bold" filter="url(#glow)">Zone Governance</text>
  <text x="600" y="410" text-anchor="middle" fill="#a0a0c0" font-family="DejaVu Sans, Arial, sans-serif" font-size="22">Cross-Assessment Research</text>
  <rect x="400" y="480" width="190" height="32" rx="16" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="495" y="502" text-anchor="middle" fill="#00d4ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">ENS</text>
  <rect x="610" y="480" width="190" height="32" rx="16" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="705" y="502" text-anchor="middle" fill="#00d4ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">ICANN</text>
  <rect x="820" y="480" width="190" height="32" rx="16" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="915" y="502" text-anchor="middle" fill="#00d4ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">DNS Root Zone</text>
  <rect x="1030" y="480" width="190" height="32" rx="16" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="0.5"/>
  <text x="1125" y="502" text-anchor="middle" fill="#00d4ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">Web3 Identity</text>
  <rect x="0" y="590" width="1200" height="2" fill="url(#accent-grad)" opacity="0.5"/>
  <text x="1180" y="618" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="DejaVu Sans, Arial, sans-serif" font-size="12">www.miamioh.edu.pl</text>
  <text x="20" y="618" fill="rgba(255,255,255,0.3)" font-family="DejaVu Sans, Arial, sans-serif" font-size="11">Web3 Domain Institute</text>
</svg>