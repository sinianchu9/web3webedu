  <!-- Title text with shadow -->
  <text x="600" y="320" text-anchor="middle" font-family="DejaVu Sans, Noto Sans, Arial, sans-serif" font-weight="bold" font-size="48" fill="white" opacity="0.2" transform="translate(2,2)">Web3域名 SSI集成机制</text>
