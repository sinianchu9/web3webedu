<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#1a1b4b;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#0d1b3e;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#f5d442;stop-opacity:0.8" />
    <stop offset="50%" style="stop-color:#1e88e5;stop-opacity:0.6" />
    <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:0.4" />
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="630" fill="url(#bgGrad)"/>

<!-- Grid -->
<g stroke="#2a2d5e" stroke-width="1" opacity="0.3">
  <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/><line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/><line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/><line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/><line x1="1200" y1="0" x2="1200" y2="630"/>
  <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/><line x1="0" y1="600" x2="1200" y2="600"/>
</g>

<!-- Diagonal decorative lines -->
<g stroke="#f5d442" stroke-width="1.5" opacity="0.2">
  <line x1="0" y1="100" x2="1200" y2="530"/>
  <line x1="0" y1="0" x2="200" y2="630"/>
  <line x1="1000" y1="0" x2="1200" y2="200"/>
</g>

<!-- Colombia color accent strip -->
<rect x="0" y="0" width="1200" height="6" fill="#f5d442" opacity="0.8"/>
<rect x="0" y="6" width="1200" height="3" fill="#1e88e5" opacity="0.6"/>
<rect x="0" y="9" width="1200" height="2" fill="#d32f2f" opacity="0.5"/>

<!-- Hexagon decorations -->
<g fill="none" stroke="#1e88e5" stroke-width="2" opacity="0.4">
  <!-- Top right hexagon -->
  <polygon points="1050,80 1080,50 1120,50 1150,80 1120,110 1080,110" />
  <!-- Mid left hexagon -->
  <polygon points="80,320 110,290 150,290 180,320 150,350 110,350" />
  <!-- Bottom right hexagon -->
  <polygon points="1020,520 1050,490 1090,490 1120,520 1090,550 1050,550" />
</g>

<!-- Circuit board pattern dots -->
<g fill="#42a5f5" opacity="0.3">
  <circle cx="200" cy="200" r="3"/>
  <circle cx="400" cy="150" r="2"/>
  <circle cx="900" cy="300" r="3"/>
  <circle cx="700" cy="500" r="2"/>
  <circle cx="300" cy="450" r="3"/>
  <circle cx="850" cy="450" r="2"/>
  <circle cx="550" cy="100" r="2"/>
  <circle cx="120" cy="550" r="3"/>
</g>

<!-- Connection lines (circuit traces) -->
<g stroke="#f5d442" stroke-width="1" opacity="0.2" fill="none">
  <path d="M200,200 L400,150 L550,100"/>
  <path d="M300,450 L700,500 L850,450"/>
  <path d="M900,300 L1020,520"/>
</g>

<!-- Title text shadow -->
<g filter="url(#glow)">
  <!-- Main title -->
  <text x="600" y="220" font-family="'Noto Sans','DejaVu Sans',sans-serif" font-size="48" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">Colombian Municipal Platform</text>
  <text x="600" y="280" font-family="'Noto Sans','DejaVu Sans',sans-serif" font-size="48" font-weight="bold"
        fill="#f5d442" text-anchor="middle" letter-spacing="2">Web3 Governance</text>
  <text x="600" y="360" font-family="'Noto Sans','DejaVu Sans',sans-serif" font-size="36" font-weight="bold"
        fill="#42a5f5" text-anchor="middle" letter-spacing="3">Domainroc x namepopo</text>
</g>

<!-- Subtitle -->
<text x="600" y="420" font-family="'Noto Sans','DejaVu Sans',sans-serif" font-size="22" font-weight="400"
      fill="#8899bb" text-anchor="middle" letter-spacing="1">Alcaldia de San Antero + Alcaldia de Caldas</text>

<!-- Web3 badge -->
<g transform="translate(850, 480)">
  <rect x="-60" y="-20" width="120" height="40" rx="8" fill="none" stroke="#f5d442" stroke-width="2" opacity="0.6"/>
  <text x="0" y="6" font-family="'Noto Sans',sans-serif" font-size="16" font-weight="bold"
        fill="#f5d442" text-anchor="middle">Web3 Gov</text>
</g>

<!-- DID badge -->
<g transform="translate(350, 480)">
  <rect x="-50" y="-20" width="100" height="40" rx="8" fill="none" stroke="#42a5f5" stroke-width="2" opacity="0.6"/>
  <text x="0" y="6" font-family="'Noto Sans',sans-serif" font-size="16" font-weight="bold"
        fill="#42a5f5" text-anchor="middle">DID System</text>
</g>

<!-- Bottom accent bar -->
<rect x="0" y="612" width="1200" height="18" fill="url(#accentGrad)"/>
<rect x="0" y="620" width="1200" height="10" fill="#0a0e27"/>

</svg>