<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#00d2ff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/><line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/><line x1="1160" y1="0" x2="1160" y2="630"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g opacity="0.06" stroke="#7b2ff7" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="200" x2="800" y2="630"/>
    <line x1="400" y1="0" x2="1200" y2="430"/>
    <line x1="0" y1="400" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="1200" y2="200"/>
  </g>
  
  <!-- Hexagons -->
  <g opacity="0.1" fill="none" stroke="#00d2ff" stroke-width="1">
    <polygon points="100,80 130,63 160,80 160,114 130,131 100,114"/>
    <polygon points="1000,450 1030,433 1060,450 1060,484 1030,501 1000,484"/>
    <polygon points="150,480 180,463 210,480 210,514 180,531 150,514"/>
    <polygon points="950,100 980,83 1010,100 1010,134 980,151 950,134"/>
  </g>
  
  <!-- Circuit board pattern -->
  <g opacity="0.07" stroke="#00d2ff" stroke-width="0.8">
    <path d="M 50,200 L 120,200 L 120,250 L 180,250" fill="none"/>
    <path d="M 1020,400 L 1080,400 L 1080,350 L 1150,350" fill="none"/>
    <circle cx="120" cy="200" r="3" fill="#00d2ff"/>
    <circle cx="180" cy="250" r="3" fill="#00d2ff"/>
    <circle cx="1080" cy="400" r="3" fill="#00d2ff"/>
    <circle cx="1150" cy="350" r="3" fill="#00d2ff"/>
  </g>
  
  <!-- Corner accents -->
  <g opacity="0.15" stroke="url(#accent)" stroke-width="2" fill="none">
    <path d="M 20,50 L 20,20 L 50,20"/>
    <path d="M 1180,20 L 1150,20 L 1150,50"/>
    <path d="M 20,580 L 20,610 L 50,610"/>
    <path d="M 1180,610 L 1150,610 L 1150,580"/>
  </g>
  
  <!-- Accent line -->
  <rect x="100" y="290" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
  <rect x="900" y="290" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Title text -->
  <text x="600" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="36" fill="white" filter="url(#glow)">CBDC域名命名与DNS治理</text>
  
  
  <!-- Keyword tag -->
  <rect x="440" y="370" width="320" height="36" rx="18" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.5"/>
  <text x="600" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#00d2ff" opacity="0.9">CBDC · mBridge · DNS · 域名治理</text>
  
  <!-- Site domain -->
  <text x="1080" y="590" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#ffffff" opacity="0.3">www.miamioh.edu.pl</text>
  
  <!-- USDT icon decoration -->
  <g opacity="0.12" transform="translate(80, 350)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#26a17b" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#26a17b" font-weight="bold">T</text>
  </g>
  <g opacity="0.1" transform="translate(1100, 180)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#627eea" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#627eea">&#x039e;</text>
  </g>
</svg>