<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="40%" stop-color="#1a1a2e"/>
      <stop offset="80%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16a085" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0f3460" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#accent)"/>
  
  <!-- Grid lines (every 40px) -->
  <g stroke="#16213e" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
  </g>
  
  <!-- Diagonal decoration lines -->
  <g stroke="#16a085" stroke-width="2" opacity="0.4">
    <line x1="0" y1="630" x2="300" y2="330"/>
    <line x1="900" y1="300" x2="1200" y2="0"/>
  </g>
  <g stroke="#0f3460" stroke-width="3" opacity="0.5">
    <line x1="50" y1="580" x2="150" y2="480"/>
    <line x1="1050" y1="150" x2="1150" y2="50"/>
  </g>
  
  <!-- Corner hexagons -->
  <polygon points="60,60 90,43 120,60 120,94 90,111 60,94" fill="none" stroke="#16a085" stroke-width="2" opacity="0.6"/>
  <polygon points="1080,536 1110,519 1140,536 1140,570 1110,587 1080,570" fill="none" stroke="#16a085" stroke-width="2" opacity="0.6"/>
  
  <!-- Corner dots -->
  <circle cx="100" cy="100" r="3" fill="#16a085" opacity="0.8"/>
  <circle cx="1100" cy="530" r="3" fill="#16a085" opacity="0.8"/>
  
  <!-- Title -->
<text x="600" y="320" text-anchor="middle" fill="white" font-size="42" font-weight="bold" font-family="sans-serif">CBDC钱包域名绑定与DNS解析容灾机制</text>

  
  <!-- Keyword tags -->
<rect x="200" y="480" width="168" height="36" rx="18" fill="#0f3460" stroke="#16a085" stroke-width="2"/>
<text x="284" y="504" text-anchor="middle" fill="#16a085" font-size="16" font-family="sans-serif">CBDC域名绑定</text>
<rect x="388" y="480" width="120" height="36" rx="18" fill="#0f3460" stroke="#16a085" stroke-width="2"/>
<text x="448" y="504" text-anchor="middle" fill="#16a085" font-size="16" font-family="sans-serif">DNS容灾</text>
<rect x="528" y="480" width="104" height="36" rx="18" fill="#0f3460" stroke="#16a085" stroke-width="2"/>
<text x="580" y="504" text-anchor="middle" fill="#16a085" font-size="16" font-family="sans-serif">支付路径</text>

  
  <!-- Source: miamioh.edu.pl -->
  <text x="1140" y="612" text-anchor="end" fill="#7f8c8d" font-size="16" font-family="sans-serif">miamioh.edu.pl</text>
  
  <!-- "Web3 Domain Institute" top corner -->
  <text x="60" y="120" fill="#7f8c8d" font-size="14" font-family="sans-serif">Web3 Domain Institute</text>
</svg>