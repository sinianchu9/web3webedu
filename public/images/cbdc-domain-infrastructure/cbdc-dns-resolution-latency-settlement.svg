    <circle cx="1170" cy="30" r="6" fill="#4fc3f7"/>
    <circle cx="30" cy="600" r="6" fill="#4fc3f7"/>
    <circle cx="1170" cy="600" r="8" fill="#e94560"/>
  </g>
  
  <!-- Top accent line -->
