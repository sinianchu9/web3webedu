    CBDC域名结算中的<tspan x="600" dy="50">DNS解析延迟评估</tspan>
  </text>
  
  <!-- Subtitle line -->
  <rect x="500" y="290" width="200" height="3" rx="1.5" fill="url(#accent-grad)"/>
  
  <!-- Keyword tags -->
  <rect x="80" y="480" width="86" height="36" rx="10" fill="#0f3460" opacity="0.8"/>
        <text x="95" y="504" font-size="15" fill="#4fc3f7" font-family="DejaVu Sans, sans-serif">CBDC</text><rect x="280" y="480" width="100" height="36" rx="10" fill="#0f3460" opacity="0.8"/>
        <text x="295" y="504" font-size="15" fill="#4fc3f7" font-family="DejaVu Sans, sans-serif">DNS解析</text><rect x="480" y="480" width="86" height="36" rx="10" fill="#0f3460" opacity="0.8"/>
        <text x="495" y="504" font-size="15" fill="#4fc3f7" font-family="DejaVu Sans, sans-serif">域名结算</text><rect x="680" y="480" width="86" height="36" rx="10" fill="#0f3460" opacity="0.8"/>
        <text x="695" y="504" font-size="15" fill="#4fc3f7" font-family="DejaVu Sans, sans-serif">延迟评估</text>
  
