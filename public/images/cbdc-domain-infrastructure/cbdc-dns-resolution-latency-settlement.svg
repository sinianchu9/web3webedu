  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent-grad)"/>
  
  <!-- Title text with shadow -->
  <text x="600" y="260" text-anchor="middle" font-size="38" fill="#ffffff" 
