    <polygon points="950,450 990,430 1030,450 1030,490 990,510 950,490"/>
    <polygon points="1050,100 1090,80 1130,100 1130,140 1090,160 1050,140"/>
  </g>
  
  <!-- Corner accents -->
  <g opacity="0.3">
