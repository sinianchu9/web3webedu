<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a4e" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Diagonal lines -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#f7931a" stroke-width="2" opacity="0.25"/>
  <line x1="1200" y1="0" x2="0" y2="630" stroke="#f7931a" stroke-width="2" opacity="0.25"/>
  <!-- Circuit board dots -->
  <circle cx="200" cy="150" r="4" fill="#f7931a" opacity="0.4"/>
  <circle cx="400" cy="500" r="3" fill="#f7931a" opacity="0.3"/>
  <circle cx="800" cy="100" r="5" fill="#f7931a" opacity="0.35"/>
  <circle cx="1000" cy="400" r="4" fill="#f7931a" opacity="0.4"/>
  <circle cx="600" cy="550" r="3" fill="#f7931a" opacity="0.3"/>
  <!-- Hexagons -->
  <polygon points="150,80 180,63 210,80 210,114 180,131 150,114" fill="none" stroke="#f7931a" stroke-width="1.5" opacity="0.3"/>
  <polygon points="950,450 980,433 1010,450 1010,484 980,501 950,484" fill="none" stroke="#f7931a" stroke-width="1.5" opacity="0.3"/>
  <!-- Corner accents -->
  <rect x="30" y="30" width="60" height="4" fill="#f7931a" opacity="0.6" rx="2"/>
  <rect x="30" y="30" width="4" height="60" fill="#f7931a" opacity="0.6" rx="2"/>
  <rect x="1110" y="596" width="60" height="4" fill="#f7931a" opacity="0.6" rx="2"/>
  <rect x="1166" y="540" width="4" height="60" fill="#f7931a" opacity="0.6" rx="2"/>
  <!-- Crypto icon -->
  <g transform="translate(100, 120) scale(2.5)">
    <circle cx="0" cy="0" r="40" fill="#f7931a" opacity="0.15"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
    <text x="0" y="14" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#f7931a" text-anchor="middle" opacity="0.5">₿</text>
  </g>
  <!-- ETH icon -->
  <g transform="translate(1050, 520) scale(2)">
    <polygon points="0,-35 25,8 0,22 -25,8" fill="#627eea" opacity="0.2"/>
    <polygon points="0,-35 25,8 0,22 -25,8" fill="none" stroke="#627eea" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Title -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    CBDC跨境结算域名依赖
  </text>
  <!-- Description -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="24" fill="#a0a0c0" text-anchor="middle">
    BIS CBDC · e-CNY · mBridge
  </text>
  <!-- Keyword tag -->
  <g transform="translate(600, 420)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#f7931a" opacity="0.2"/>
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="none" stroke="#f7931a" stroke-width="2"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" fill="#f7931a" text-anchor="middle">CBDC域名支付</text>
  </g>
  <!-- Site domain -->
  <text x="1160" y="595" font-family="Arial, sans-serif" font-size="22" fill="#f7931a" text-anchor="end" font-weight="bold">
    miamioh.edu.pl
  </text>
</svg>