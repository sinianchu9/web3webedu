<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Grid -->
  <g stroke="#ffffff10" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/> <line x1="40" y1="0" x2="40" y2="630"/> <line x1="80" y1="0" x2="80" y2="630"/> <line x1="120" y1="0" x2="120" y2="630"/> <line x1="160" y1="0" x2="160" y2="630"/> <line x1="200" y1="0" x2="200" y2="630"/> <line x1="240" y1="0" x2="240" y2="630"/> <line x1="280" y1="0" x2="280" y2="630"/> <line x1="320" y1="0" x2="320" y2="630"/> <line x1="360" y1="0" x2="360" y2="630"/> <line x1="400" y1="0" x2="400" y2="630"/> <line x1="440" y1="0" x2="440" y2="630"/> <line x1="480" y1="0" x2="480" y2="630"/> <line x1="520" y1="0" x2="520" y2="630"/> <line x1="560" y1="0" x2="560" y2="630"/> <line x1="600" y1="0" x2="600" y2="630"/> <line x1="640" y1="0" x2="640" y2="630"/> <line x1="680" y1="0" x2="680" y2="630"/> <line x1="720" y1="0" x2="720" y2="630"/> <line x1="760" y1="0" x2="760" y2="630"/> <line x1="800" y1="0" x2="800" y2="630"/> <line x1="840" y1="0" x2="840" y2="630"/> <line x1="880" y1="0" x2="880" y2="630"/> <line x1="920" y1="0" x2="920" y2="630"/> <line x1="960" y1="0" x2="960" y2="630"/> <line x1="1000" y1="0" x2="1000" y2="630"/> <line x1="1040" y1="0" x2="1040" y2="630"/> <line x1="1080" y1="0" x2="1080" y2="630"/> <line x1="1120" y1="0" x2="1120" y2="630"/> <line x1="1160" y1="0" x2="1160" y2="630"/> <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/> <line x1="0" y1="40" x2="1200" y2="40"/> <line x1="0" y1="80" x2="1200" y2="80"/> <line x1="0" y1="120" x2="1200" y2="120"/> <line x1="0" y1="160" x2="1200" y2="160"/> <line x1="0" y1="200" x2="1200" y2="200"/> <line x1="0" y1="240" x2="1200" y2="240"/> <line x1="0" y1="280" x2="1200" y2="280"/> <line x1="0" y1="320" x2="1200" y2="320"/> <line x1="0" y1="360" x2="1200" y2="360"/> <line x1="0" y1="400" x2="1200" y2="400"/> <line x1="0" y1="440" x2="1200" y2="440"/> <line x1="0" y1="480" x2="1200" y2="480"/> <line x1="0" y1="520" x2="1200" y2="520"/> <line x1="0" y1="560" x2="1200" y2="560"/> <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal lines -->
  <g stroke="#ffffff08" stroke-width="1">
    <line x1="0" y1="630" x2="600" y2="0"/>
    <line x1="200" y1="630" x2="800" y2="0"/>
    <line x1="400" y1="630" x2="1000" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="0"/>
    <line x1="0" y1="400" x2="1200" y2="200"/>
  </g>
  
  <!-- Hexagon decorations -->
  <g fill="none" stroke="#4fc3f720" stroke-width="2">
    <polygon points="100,80 140,57 180,80 180,126 140,149 100,126"/>
    <polygon points="1020,500 1060,477 1100,500 1100,546 1060,569 1020,546"/>
    <polygon points="950,80 990,57 1030,80 1030,126 990,149 950,126"/>
  </g>
  
  <!-- Circuit patterns -->
  <g stroke="#4fc3f715" stroke-width="2" fill="none">
    <path d="M 50 300 L 120 300 L 140 280 L 200 280"/>
    <path d="M 1000 350 L 1060 350 L 1080 370 L 1150 370"/>
    <circle cx="200" cy="280" r="4" fill="#4fc3f730"/>
    <circle cx="1150" cy="370" r="4" fill="#4fc3f730"/>
  </g>
  
  <!-- Corner decorations -->
  <g fill="#4fc3f740">
    <circle cx="30" cy="30" r="5"/>
    <circle cx="1170" cy="30" r="5"/>
    <circle cx="30" cy="600" r="5"/>
    <circle cx="1170" cy="600" r="5"/>
  </g>
  
  <!-- Small dots pattern -->
  <g fill="#ffffff08">
    <circle cx="300" cy="500" r="2"/>
    <circle cx="320" cy="480" r="2"/>
    <circle cx="340" cy="500" r="2"/>
    <circle cx="860" cy="130" r="2"/>
    <circle cx="880" cy="110" r="2"/>
    <circle cx="900" cy="130" r="2"/>
  </g>
  
  <!-- Title text with glow -->
  <text x="600" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="bold" 
        fill="white" text-anchor="middle" filter="url(#glow)">NFT Domain Market Maker</text>
  
  <!-- Subtitle / keywords -->
  <text x="600" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" 
        fill="#a0c4ff" text-anchor="middle" opacity="0.8">Liquidity Governance Research</text>
  
  <!-- Cluster tag -->
  <rect x="480" y="370" width="240" height="36" rx="18" fill="#4fc3f720" stroke="#4fc3f7" stroke-width="1"/>
  <text x="600" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" 
        fill="#4fc3f7" text-anchor="middle">nft-domain-market</text>
  
  <!-- Domain watermark -->
  <text x="1080" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" 
        fill="#ffffff40" text-anchor="end">miamioh.edu.pl</text>
  
  <!-- Keyword subtle text -->
  <text x="120" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" 
        fill="#ffffff30" text-anchor="start">Web3 Domain Research</text>
</svg>