    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  <!-- diagonal -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="url(#g2)" stroke-width="1.5" opacity="0.55"/>
  <line x1="1200" y1="0" x2="0" y2="630" stroke="url(#g2)" stroke-width="1.5" opacity="0.4"/>
  <!-- hexagon icons -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.55">
    <polygon points="80,90 140,90 170,140 140,190 80,190 50,140"/>
    <polygon points="1020,490 1080,490 1110,540 1080,590 1020,590 990,540"/>
  </g>
  <g fill="#A78BFA" opacity="0.18">
    <circle cx="170" cy="140" r="22"/>
    <circle cx="990" cy="540" r="22"/>
  </g>
  <!-- corner dots -->
  <g fill="#22D3EE">
    <circle cx="40" cy="40" r="3"/><circle cx="1160" cy="40" r="3"/><circle cx="40" cy="590" r="3"/><circle cx="1160" cy="590" r="3"/>
  </g>
  <!-- circuit traces -->
  <g stroke="#22D3EE" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 200 530 L 320 530 L 320 470 L 460 470"/>
    <path d="M 980 100 L 860 100 L 860 160 L 720 160"/>
    <circle cx="200" cy="530" r="3" fill="#22D3EE"/>
    <circle cx="460" cy="470" r="3" fill="#22D3EE"/>
    <circle cx="980" cy="100" r="3" fill="#22D3EE"/>
    <circle cx="720" cy="160" r="3" fill="#22D3EE"/>
  </g>
  <!-- key tag chip -->
  <g transform="translate(460 215)">
    <rect width="280" height="44" rx="22" fill="#22D3EE" opacity="0.18" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="140" y="29" text-anchor="middle" fill="#22D3EE" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="20">{key_tag}</text>
  </g>
  <!-- title -->
  <text x="600" y="320" text-anchor="middle" fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="42" filter="url(#glow)">{title}</text>
  <text x="600" y="380" text-anchor="middle" fill="#CBD5E1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">{subtitle}</text>
  <!-- domain -->
  <text x="600" y="540" text-anchor="middle" fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16">{domain}</text>
  <text x="600" y="568" text-anchor="middle" fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" opacity="0.55">Web3 Domain Research Institute</text>
</svg>