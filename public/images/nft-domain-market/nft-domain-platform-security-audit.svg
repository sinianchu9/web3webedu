<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NFT Domain Platform Security">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.15">
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="40" y1="0" x2="40" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="280" y1="0" x2="280" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="440" y1="0" x2="440" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="520" y1="0" x2="520" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="680" y1="0" x2="680" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="760" y1="0" x2="760" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1160" y1="0" x2="1160" y2="630"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Diagonal decorative lines -->
  <line x1="0" y1="630" x2="400" y2="0" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="800" y1="630" x2="1200" y2="0" stroke="url(#lineGrad)" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#00d4ff" stroke-width="0.5" opacity="0.1"/>
  
  <!-- Hexagon decoration -->
  <g transform="translate(100, 100)" opacity="0.2">
    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <polygon points="50,15 85,32 85,68 50,85 15,68 15,32" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
  <g transform="translate(1050, 480)" opacity="0.2">
    <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="none" stroke="#00d4ff" stroke-width="1"/>
  </g>
  
  <!-- Circuit patterns -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.15">
    <polyline points="50,300 80,300 80,350 120,350" fill="none"/>
    <polyline points="1150,280 1120,280 1120,330 1080,330" fill="none"/>
    <circle cx="50" cy="300" r="3" fill="#00d4ff"/>
    <circle cx="1150" cy="280" r="3" fill="#00d4ff"/>
  </g>
  
  <!-- DNS/Axfr icon - stylized server racks -->
  <g transform="translate(900, 180)" opacity="0.4">
    <rect x="0" y="0" width="60" height="80" rx="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="5" y="10" width="50" height="8" rx="2" fill="#00d4ff" opacity="0.6"/>
    <rect x="5" y="25" width="50" height="8" rx="2" fill="#00d4ff" opacity="0.4"/>
    <rect x="5" y="40" width="50" height="8" rx="2" fill="#00d4ff" opacity="0.6"/>
    <rect x="5" y="55" width="50" height="8" rx="2" fill="#00d4ff" opacity="0.4"/>
    <circle cx="48" cy="67" r="3" fill="#00d4ff" opacity="0.8"/>
  </g>
  
  <!-- NFT icon - cube -->
  <g transform="translate(950, 200)" opacity="0.4">
    <polygon points="40,0 80,20 80,70 40,50 0,70 0,20" fill="none" stroke="#e94560" stroke-width="1.5"/>
    <polygon points="40,0 80,20 40,40 0,20" fill="none" stroke="#e94560" stroke-width="1"/>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#e94560" stroke-width="1"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" filter="url(#glow)">NFT Domain Platform Security</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#a0c4ff">DNS Security & NFT Domain Research</text>
  
  <!-- Keywords -->
  <g transform="translate(380, 400)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#00d4ff" opacity="0.15"/>
    <rect x="0" y="0" width="180" height="32" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="90" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff">DNS AXFR Security</text>
  </g>
  <g transform="translate(580, 400)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#e94560" opacity="0.15"/>
    <rect x="0" y="0" width="160" height="32" rx="16" fill="none" stroke="#e94560" stroke-width="1" opacity="0.5"/>
    <text x="80" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e94560">Smart Contract</text>
  </g>
  <g transform="translate(760, 400)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#00d4ff" opacity="0.15"/>
    <rect x="0" y="0" width="120" height="32" rx="16" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="60" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff">NFT Domain</text>
  </g>
  
  <!-- Site domain -->
  <text x="1100" y="600" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#a0c4ff" opacity="0.7">miamioh.edu.pl</text>
  
  <!-- Corner brackets -->
  <g stroke="#00d4ff" stroke-width="2" opacity="0.5" fill="none">
    <polyline points="20,40 20,20 40,20"/>
    <polyline points="1160,20 1180,20 1180,40"/>
    <polyline points="20,590 20,610 40,610"/>
    <polyline points="1160,610 1180,610 1180,590"/>
  </g>
</svg>